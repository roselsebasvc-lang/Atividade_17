<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperação de Senha - Frutas Cítricas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Recuperação de Senha</h1>

        <nav>
            <button>
                <strong>
                    <a href="../login/login.html">Voltar para Login</a>
                </strong>
            </button>
        </nav>
    </header>

    <main>

        <section>
            <img src="../../IMAGENS/Frutas citricas.jpg" alt="Frutas Cítricas" width="500" height="300">
        </section>

        <section>
            <h2>Esqueceu sua senha?</h2>

            <p>
                Digite abaixo o e-mail cadastrado em sua conta.
                Você receberá instruções para redefinir sua senha.
            </p>

            <form>
                <label for="email">
                    E-mail:
                </label>

                <input type="email" id="email" name="email" placeholder="Digite seu e-mail cadastrado  " required>

                <button type="submit" onclick="alert('Instruções de recuperação enviadas para o e-mail informado!')">
                    Enviar
                </button>

            </form>

        </section>

    </main>

    <br>

    <footer>
        <p>&copy; 2026 Frutas Cítricas - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
