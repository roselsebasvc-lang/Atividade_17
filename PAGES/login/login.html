<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Frutas Cítricas</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Área de Login</h1>

        <nav>
            <button><strong><a href="../../index.html">Voltar para o inicio</a></strong></button>
        </nav>
    </header>

    <main>

        <section>
            <img src="../../IMAGENS/Frutas citricas.jpg" alt="Frutas Cítricas" width="500" height="300">
        </section>

        <section>
            <h2>Entre em sua conta</h2>

            <form>
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>

                <label for="senha">Senha:</label>
                <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

                <button type="submit">
                    Entrar
                </button>

                <p>
                    <a href="../esqueciSenha/esqueciSenha.html">Esqueci minha senha</a>
                </p>

                <p>
                    Não tem cadastro?
                    <a href="../cadastro/cadastro.html">Cadastre-se</a>
                </p>

            </form>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Frutas Cítricas - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
