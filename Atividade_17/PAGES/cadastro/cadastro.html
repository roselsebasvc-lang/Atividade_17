<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - Frutas Cítricas Premium</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="top-bar">
        🍊 Crie sua conta e receba as melhores ofertas
    </header>

    <nav class="navbar">

        <div class="logo">
            🍋 Frutas Cítricas
        </div>

        <ul>
            <li><a href="../../index.html">Início</a></li>
            <li><a href="../login/login.html">Login</a></li>
        </ul>

    </nav>

    <section class="cadastro-container">

        <div class="formulario-card">

            <h1>Crie sua Conta</h1>

            <p class="subtitulo">
                Cadastre-se para comprar frutas frescas e acompanhar seus pedidos.
            </p>

            <form>

                <div class="campo">
                    <label for="nome">Nome Completo</label>
                    <input type="text" id="nome" required>
                </div>

                <div class="campo">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" required>
                </div>

                <div class="campo">
                    <label for="confirmarSenha">Confirmar Senha</label>
                    <input type="password" id="confirmarSenha" required>
                </div>

                <div class="duas-colunas">

                    <div class="campo">
                        <label for="rg">RG</label>
                        <input type="text" id="rg" required>
                    </div>

                    <div class="campo">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" required>
                    </div>

                </div>

                <div class="campo">
                    <label for="endereco">Endereço</label>
                    <input type="text" id="endereco" required>
                </div>

                <div class="duas-colunas">

                    <div class="campo">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" required>
                    </div>

                    <div class="campo">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" required>
                    </div>

                </div>

                <div class="duas-colunas">

                    <div class="campo">
                        <label for="estado">Estado</label>
                        <input type="text" id="estado" required>
                    </div>

                    <div class="campo">
                        <label for="pais">País</label>
                        <input type="text" id="pais" required>
                    </div>

                </div>

                <div class="campo">
                    <label for="dataNascimento">
                        Data de Nascimento
                    </label>

                    <input type="date" id="dataNascimento" required>
                </div>

                <div class="botoes-form">

                    <button type="submit" class="btn-cadastrar">

                        Cadastrar
                    </button>

                    <button type="reset" class="btn-limpar">

                        Limpar
                    </button>

                </div>

            </form>

            <div class="login-link">

                <p>
                    Já possui cadastro?
                </p>

                <a href="../login/login.html">
                    Fazer Login
                </a>

            </div>

        </div>

    </section>

    <footer>
        <p>
            © 2026 Frutas Cítricas Premium - Todos os direitos reservados.
        </p>
    </footer>

</body>

</html>
